<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Examination Form Fillup Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F4F7F5;
            color: #1D1D1F;
            overflow-x: hidden;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.04);
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        .apple-button {
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .apple-button:active {
            transform: scale(0.97);
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white pb-6">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 glass-nav px-3 py-2.5 transition-all w-full">
        <div class="flex items-center justify-between gap-2">
            <div class="flex items-center space-x-2 cursor-pointer min-w-0" onclick="goScreen1()">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-md shadow-emerald-500/20 shrink-0">
                    <i data-lucide="graduation-cap" class="w-4 h-4"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="text-xs font-semibold tracking-tight text-gray-900 truncate">Exam Form Portal</h1>
                    <p class="text-[10px] text-gray-500 font-medium truncate">Student Records</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 shrink-0">
                <button onclick="loadSheetData()" class="apple-button p-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-200/60 shadow-sm" title="Sync Data">
                    <i data-lucide="rotate-cw" class="w-3.5 h-3.5" id="refresh-icon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow w-full px-3 py-3 space-y-3.5">

        <!-- Loading State -->
        <div id="loading-state" class="flex flex-col items-center justify-center py-20 space-y-4">
            <div class="relative w-12 h-12">
                <div class="absolute inset-0 rounded-full border-4 border-emerald-200 animate-pulse"></div>
                <div class="absolute inset-0 rounded-full border-4 border-emerald-600 border-t-transparent animate-spin"></div>
            </div>
            <p class="text-sm font-medium text-gray-500 animate-pulse">Loading records...</p>
        </div>

        <!-- SCREEN 1: Dashboard with Class-wise Breakdown & School Cards -->
        <div id="screen-1" class="hidden space-y-3.5">
            
            <!-- Dashboard Board for Total Students Form Fillup -->
            <div class="glass-card p-3.5 rounded-2xl border border-white/80 shadow-sm space-y-2.5 bg-gradient-to-br from-emerald-600 to-teal-600 text-white">
                <div class="flex items-center justify-between">
                    <div class="min-w-0 pr-2">
                        <p class="text-[10px] font-semibold uppercase tracking-wider text-emerald-100 truncate">Total Students Form Fillup</p>
                        <h3 id="stat-total-students" class="text-2xl font-extrabold tracking-tight mt-0.5">0</h3>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-white/15 backdrop-blur-md text-white flex items-center justify-center shrink-0 border border-white/20">
                        <i data-lucide="users" class="w-5 h-5"></i>
                    </div>
                </div>
                <!-- Class-wise enrollment breakdown pills on dashboard -->
                <div class="pt-2 border-t border-white/15">
                    <p class="text-[10px] font-semibold uppercase tracking-wider text-emerald-100 mb-1.5">Class-wise Enrollment:</p>
                    <div id="dashboard-class-breakdown" class="flex flex-wrap gap-1"></div>
                </div>
            </div>

            <!-- School Cards List Section -->
            <div class="space-y-2.5">
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </span>
                    <input type="text" id="institute-search" onkeyup="filterInstitutions()" placeholder="Search school name..." class="w-full pl-9 pr-3 py-2 bg-white/80 border border-gray-200/80 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500/20 shadow-sm">
                </div>

                <div id="institute-cards-grid" class="space-y-2.5 pt-0.5"></div>
            </div>
        </div>

        <!-- SCREEN 2: Institute Detail Tabular View -->
        <div id="screen-2" class="hidden space-y-3">
            <div class="flex items-center justify-between gap-2 bg-white/60 p-2.5 rounded-2xl border border-white/80 shadow-sm">
                <div class="flex items-center space-x-2 min-w-0">
                    <button onclick="goScreen1()" class="w-8 h-8 rounded-xl bg-white hover:bg-gray-100 flex items-center justify-center text-gray-700 border border-gray-200 shadow-sm transition-all shrink-0">
                        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    </button>
                    <div class="min-w-0">
                        <h2 id="screen2-inst-title" class="text-xs font-bold text-gray-900 truncate">School Name</h2>
                    </div>
                </div>
                <span id="screen2-count" class="text-[10px] font-semibold px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded-full shrink-0">0 students</span>
            </div>

            <div class="relative w-full">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </span>
                <input type="text" id="student-search" onkeyup="filterStudentsTable()" placeholder="Search student name, class..." class="w-full pl-9 pr-3 py-2 bg-white/80 border border-gray-200/80 rounded-xl text-xs focus:outline-none shadow-sm">
            </div>

            <!-- Tabular Data Card -->
            <div class="glass-card rounded-2xl overflow-hidden border border-white/80 shadow-sm">
                <div class="overflow-x-auto w-full">
                    <table class="w-full text-left border-collapse border border-gray-200 table-auto">
                        <thead>
                            <tr class="bg-gray-50/90 border-b border-gray-200 text-[10px] font-semibold tracking-wider text-gray-500 uppercase">
                                <th class="py-2 px-2 w-8 text-center border-r border-gray-200">Sr</th>
                                <th class="py-2 px-2.5 border-r border-gray-200">Student Name</th>
                                <th class="py-2 px-2 text-center w-14">Class</th>
                            </tr>
                        </thead>
                        <tbody id="screen2-tbody" class="divide-y divide-gray-200 text-xs"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- Payment Proof Modal Viewer -->
    <div id="proof-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden p-3 opacity-0 transition-opacity duration-300">
        <div class="glass-card max-w-sm w-full rounded-3xl overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col max-h-[85vh]" id="modal-container">
            <div class="px-3.5 py-2.5 border-b border-gray-100 flex items-center justify-between bg-white/90 shrink-0">
                <div class="flex items-center space-x-2 min-w-0 pr-2">
                    <div class="w-6 h-6 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
                        <i data-lucide="image" class="w-3 h-3"></i>
                    </div>
                    <h3 class="font-semibold text-gray-900 text-xs truncate">Payment Proof Viewer</h3>
                </div>
                <button onclick="closeProofModal()" class="w-6 h-6 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-600 shrink-0">
                    <i data-lucide="x" class="w-3 h-3"></i>
                </button>
            </div>
            <div class="p-3 bg-gray-50/50 flex flex-col items-center justify-center overflow-y-auto">
                <div id="modal-content-area" class="w-full flex flex-col items-center justify-center"></div>
            </div>
            <div class="px-3.5 py-2 bg-white/90 border-t border-gray-100 flex justify-end shrink-0">
                <button onclick="closeProofModal()" class="px-3 py-1 bg-gray-900 hover:bg-gray-800 text-white rounded-xl text-xs font-medium">Close</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full py-3 mt-4 border-t border-gray-200/60 bg-white/40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-3 text-center">
            <p class="text-[10px] font-medium text-gray-500 tracking-wide">Made by Darpan Sukla</p>
        </div>
    </footer>

    <!-- App Logic Script -->
    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTREPELA-qDTZPcLuXcsYSTPhd-HLih41DVbMK0Wnsrc3Z6M5WrXZWohvHTiLWES5AvFa6fRzQ7_Ayo/pub?gid=0&single=true&output=csv";
        let globalData = [];
        let currentSelectedInstitute = "";

        function toProperCase(str) {
            if (!str) return '';
            return str.toLowerCase().replace(/(^\w{1})|(\s+\w{1})/g, match => match.toUpperCase());
        }

        window.addEventListener('DOMContentLoaded', loadSheetData);

        function loadSheetData() {
            const refreshIcon = document.getElementById('refresh-icon');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');

            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (refreshIcon) refreshIcon.classList.remove('animate-spin');
                    
                    let rawData = results.data.map(row => {
                        let cleaned = {};
                        for (let key in row) {
                            let val = row[key] ? row[key].trim() : '';
                            if (key.trim() === "Student Name" || key.trim() === "Guardian Name" || key.trim() === "Institution") {
                                cleaned[key.trim()] = toProperCase(val);
                            } else if (key.trim() === "Class") {
                                cleaned[key.trim()] = val.replace(/\s*\([^)]*class[^)]*\)/gi, '').trim();
                            } else {
                                cleaned[key.trim()] = val;
                            }
                        }
                        return cleaned;
                    }).filter(row => row["Class"] && row["Class"] !== "");

                    globalData = rawData.filter(row => {
                        let inst = (row["Institution"] || "").toLowerCase();
                        return inst.includes("sitroban");
                    });

                    document.getElementById('loading-state').classList.add('hidden');
                    goScreen1();
                    lucide.createIcons();
                },
                error: function() {
                    if (refreshIcon) refreshIcon.classList.remove('animate-spin');
                    document.getElementById('loading-state').innerHTML = `<p class="text-red-500 text-xs font-medium text-center">Failed to load Google Sheet data. Please check connection.</p>`;
                }
            });
        }

        function goScreen1() {
            document.getElementById('screen-2').classList.add('hidden');
            document.getElementById('screen-1').classList.remove('hidden');
            renderScreen1(globalData);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderScreen1(data) {
            document.getElementById('stat-total-students').innerText = data.length;

            let classCounts = {};
            data.forEach(row => {
                let cls = row["Class"] || "Other";
                classCounts[cls] = (classCounts[cls] || 0) + 1;
            });

            let breakdownContainer = document.getElementById('dashboard-class-breakdown');
            breakdownContainer.innerHTML = '';

            let sortedClasses = Object.keys(classCounts).sort();
            sortedClasses.forEach(cls => {
                breakdownContainer.innerHTML += `
                    <span class="px-1.5 py-0.5 bg-white/20 backdrop-blur-sm rounded-md text-[10px] font-medium text-white flex items-center space-x-1">
                        <span>${cls}:</span>
                        <span class="font-bold bg-white/25 px-1 rounded">${classCounts[cls]}</span>
                    </span>
                `;
            });

            const institutions = [...new Set(data.map(i => i["Institution"]).filter(Boolean))].sort();
            renderInstituteCards(institutions, data);
        }

        function renderInstituteCards(institutions, data) {
            let container = document.getElementById('institute-cards-grid');
            container.innerHTML = '';

            institutions.forEach(inst => {
                let instStudents = data.filter(i => i["Institution"] === inst);

                container.innerHTML += `
                    <div onclick="openInstituteScreen('${inst.replace(/'/g, "\\'")}')" class="glass-card p-3 rounded-2xl border border-white/80 shadow-sm hover:shadow-md cursor-pointer transition-all group flex items-center justify-between space-x-2">
                        <div class="flex items-center space-x-2.5 min-w-0">
                            <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center group-hover:scale-105 transition-transform shrink-0">
                                <i data-lucide="school" class="w-4 h-4"></i>
                            </div>
                            <div class="min-w-0 pr-1">
                                <h3 class="font-bold text-gray-900 text-xs group-hover:text-emerald-600 transition-colors truncate">${inst}</h3>
                                <p class="text-[10px] text-gray-500 font-medium mt-0.5">${instStudents.length} student submissions</p>
                            </div>
                        </div>
                        <div class="w-7 h-7 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 group-hover:bg-emerald-50 group-hover:text-emerald-600 transition-colors shrink-0">
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function filterInstitutions() {
            let query = document.getElementById('institute-search').value.toLowerCase();
            let institutions = [...new Set(globalData.map(i => i["Institution"]).filter(Boolean))].sort();
            let filtered = institutions.filter(i => i.toLowerCase().includes(query));
            renderInstituteCards(filtered, globalData);
        }

        function openInstituteScreen(instituteName) {
            currentSelectedInstitute = instituteName;
            document.getElementById('screen-1').classList.add('hidden');
            document.getElementById('screen-2').classList.remove('hidden');
            document.getElementById('screen2-inst-title').innerText = instituteName;
            document.getElementById('student-search').value = '';

            let filteredStudents = globalData.filter(i => i["Institution"] === instituteName);
            renderScreen2Table(filteredStudents);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderScreen2Table(data) {
            let tbody = document.getElementById('screen2-tbody');
            let countSpan = document.getElementById('screen2-count');
            tbody.innerHTML = '';
            countSpan.innerText = data.length + (data.length === 1 ? ' student' : ' students');

            data.forEach((row, index) => {
                let receiptNo = row["Receipt No"] || "N/A";
                let dateTime = row["Date & Time"] || row["Timestamp"] || "-";
                let studentName = row["Student Name"] || "-";
                let guardianName = row["Guardian Name"] || "-";
                let whatsapp = row["WhatsApp"] || "-";
                let studentClass = row["Class"] || "-";
                let paymentMode = row["Payment Mode"] || "-";
                let amount = row["Amount"] || "-";
                let proofLink = row["Payment Proof Link"] || "";

                let formattedAmount = amount;
                if (!isNaN(amount.replace(/[^0-9.]/g, '')) && amount.trim() !== '') {
                    formattedAmount = '₹' + parseFloat(amount.replace(/[^0-9.]/g, '')).toLocaleString('en-IN');
                }

                let whatsappHtml = whatsapp !== '-' ? 
                    `<a href="https://wa.me/${whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="inline-flex items-center space-x-1 text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-lg text-xs font-medium">
                        <i data-lucide="message-circle" class="w-3 h-3"></i>
                        <span>${whatsapp}</span>
                    </a>` : '-';

                let proofHtml = '<span class="text-gray-400 text-xs italic">No Proof</span>';
                if (proofLink) {
                    proofHtml = `
                        <button onclick='openProofModal(${JSON.stringify(proofLink)}, ${JSON.stringify(studentName)}, ${JSON.stringify(receiptNo)})' class="inline-flex items-center space-x-1 px-2.5 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl text-xs font-medium transition-all shadow-sm">
                            <i data-lucide="eye" class="w-3 h-3"></i>
                            <span>View Proof</span>
                        </button>
                    `;
                }

                let rowId = `student-details-${index}`;

                let tr = document.createElement('tr');
                tr.className = "hover:bg-emerald-50/25 transition-colors cursor-pointer border-b border-gray-200";
                tr.onclick = function() {
                    let detailRow = document.getElementById(rowId);
                    if (detailRow.classList.contains('hidden')) {
                        detailRow.classList.remove('hidden');
                    } else {
                        detailRow.classList.add('hidden');
                    }
                };

                tr.innerHTML = `
                    <td class="py-2.5 px-2 font-semibold text-gray-500 text-[11px] text-center border-r border-gray-200 align-middle">${index + 1}</td>
                    <td class="py-2.5 px-2.5 border-r border-gray-200 align-middle">
                        <div class="font-bold text-gray-900 text-xs flex items-center justify-between gap-1">
                            <span class="break-words leading-tight pr-1">${studentName}</span>
                            <span class="text-[9px] text-emerald-600 font-medium flex items-center shrink-0">More <i data-lucide="chevron-down" class="w-2.5 h-2.5 ml-0.5"></i></span>
                        </div>
                    </td>
                    <td class="py-2.5 px-2 text-center align-middle">
                        <span class="px-1.5 py-0.5 bg-gray-100 text-gray-700 rounded text-[10px] font-medium inline-block whitespace-nowrap">${studentClass}</span>
                    </td>
                `;
                tbody.appendChild(tr);

                let detailTr = document.createElement('tr');
                detailTr.id = rowId;
                detailTr.className = "hidden bg-gray-50/90 border-b border-gray-200";
                detailTr.innerHTML = `
                    <td colspan="3" class="p-2.5">
                        <div class="grid grid-cols-1 gap-2 p-2.5 bg-white rounded-xl border border-gray-200 shadow-xs">
                            <div>
                                <p class="text-[9px] font-semibold uppercase tracking-wider text-gray-400">Guardian Name</p>
                                <p class="text-xs font-semibold text-gray-800 mt-0.5 break-words">${guardianName}</p>
                            </div>
                            <div>
                                <p class="text-[9px] font-semibold uppercase tracking-wider text-gray-400">WhatsApp No.</p>
                                <p class="text-xs font-semibold text-gray-800 mt-0.5">${whatsappHtml}</p>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <p class="text-[9px] font-semibold uppercase tracking-wider text-gray-400">Receipt & Date</p>
                                    <p class="text-[11px] font-semibold text-gray-800 mt-0.5 break-words">${receiptNo} <span class="text-[10px] font-normal text-gray-500 block">(${dateTime})</span></p>
                                </div>
                                <div>
                                    <p class="text-[9px] font-semibold uppercase tracking-wider text-gray-400">Payment (${paymentMode})</p>
                                    <p class="text-xs font-bold text-emerald-600 mt-0.5">${formattedAmount}</p>
                                </div>
                            </div>
                            <div class="pt-1.5 border-t border-gray-100 flex items-center justify-between gap-2">
                                <span class="text-[11px] text-gray-500 font-medium">Payment Proof:</span>
                                <div>${proofHtml}</div>
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(detailTr);
            });
            lucide.createIcons();
        }

        function filterStudentsTable() {
            let query = document.getElementById('student-search').value.toLowerCase();
            let instStudents = globalData.filter(i => i["Institution"] === currentSelectedInstitute);
            let filtered = instStudents.filter(row => {
                let name = (row["Student Name"] || "").toLowerCase();
                let guardian = (row["Guardian Name"] || "").toLowerCase();
                let receipt = (row["Receipt No"] || "").toLowerCase();
                let cls = (row["Class"] || "").toLowerCase();
                return name.includes(query) || guardian.includes(query) || receipt.includes(query) || cls.includes(query);
            });
            renderScreen2Table(filtered);
        }

        function openProofModal(url, studentName, receiptNo) {
            const modal = document.getElementById('proof-modal');
            const container = document.getElementById('modal-content-area');
            
            let embedUrl = url;
            if (url.includes('drive.google.com/file/d/')) {
                let match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) embedUrl = `https://drive.google.com/file/d/${match[1]}/preview`;
            }

            container.innerHTML = `
                <div class="w-full text-center space-y-2">
                    <div class="text-[10px] font-semibold text-gray-500 truncate px-1">Student: <span class="text-gray-900">${studentName}</span> | Receipt: <span class="text-gray-900">${receiptNo}</span></div>
                    <div class="w-full bg-white rounded-2xl overflow-hidden border border-gray-200/80 p-1.5 flex items-center justify-center" style="min-height: 200px;">
                        ${embedUrl.includes('preview') || embedUrl.includes('drive.google.com') ? 
                            `<iframe src="${embedUrl}" class="w-full h-60 rounded-xl border-0"></iframe>` :
                            `<img src="${embedUrl}" alt="Payment Proof" class="max-h-60 mx-auto rounded-xl object-contain">`
                        }
                    </div>
                    <a href="${url}" target="_blank" class="inline-flex items-center space-x-1 text-[11px] text-emerald-600 hover:text-emerald-700 font-medium">
                        <i data-lucide="external-link" class="w-3 h-3"></i>
                        <span>Open original proof in new tab</span>
                    </a>
                </div>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modal-container').classList.remove('scale-95');
                document.getElementById('modal-container').classList.add('scale-100');
            }, 10);
            lucide.createIcons();
        }

        function closeProofModal() {
            const modal = document.getElementById('proof-modal');
            modal.classList.add('opacity-0');
            document.getElementById('modal-container').classList.remove('scale-100');
            document.getElementById('modal-container').classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
    </script>
</body>
</html>
